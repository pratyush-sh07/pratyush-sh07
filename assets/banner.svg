<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1228" />
      <stop offset="60%" stop-color="#060914" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Neon Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0070F3" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="35%" stop-color="#7928CA" />
      <stop offset="70%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 245, 255, 0)" />
      <stop offset="50%" stop-color="rgba(0, 245, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(0, 245, 255, 0)" />
    </linearGradient>

    <linearGradient id="wireframe-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 245, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 245, 255, 0)" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 245, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(121, 40, 202, 0.15)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      .laser-beam {
        animation: scanline 8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes scanline {
        0% { transform: translateX(-300px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateX(1400px); opacity: 0; }
      }

      .pulse-node {
        animation: pulseAnimation 3s ease-in-out infinite alternate;
      }
      @keyframes pulseAnimation {
        0% { opacity: 0.3; r: 3; }
        100% { opacity: 1; r: 5.5; }
      }

      .status-blink {
        animation: blinkAnimation 1.8s ease-in-out infinite;
      }
      @keyframes blinkAnimation {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .wave-frequency {
        stroke-dasharray: 12, 6;
        animation: waveShift 15s linear infinite;
      }
      @keyframes waveShift {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -300; }
      }

      .title-text {
        letter-spacing: 4px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
        font-weight: 900;
      }

      .mono-hud {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Base Wallpaper Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" />

  <!-- Cyber Grid Wireframe Background -->
  <g opacity="0.35">
    <!-- Horizontal Perspective Grid Lines -->
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#00F5FF" stroke-width="1.5" />
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#00F5FF" stroke-width="1" opacity="0.8" />
    <line x1="0" y1="225" x2="1200" y2="225" stroke="#00F5FF" stroke-width="0.75" opacity="0.6" />
    <line x1="0" y1="205" x2="1200" y2="205" stroke="#00F5FF" stroke-width="0.5" opacity="0.4" />
    <line x1="0" y1="190" x2="1200" y2="190" stroke="#00F5FF" stroke-width="0.5" opacity="0.25" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#00F5FF" stroke-width="0.5" opacity="0.15" />

    <!-- Perspective Rays -->
    <line x1="600" y1="170" x2="-200" y2="320" stroke="#00F5FF" stroke-width="0.8" opacity="0.4" />
    <line x1="600" y1="170" x2="0" y2="320" stroke="#00F5FF" stroke-width="0.8" opacity="0.5" />
    <line x1="600" y1="170" x2="200" y2="320" stroke="#00F5FF" stroke-width="0.8" opacity="0.6" />
    <line x1="600" y1="170" x2="400" y2="320" stroke="#00F5FF" stroke-width="0.8" opacity="0.7" />
    <line x1="600" y1="170" x2="600" y2="320" stroke="#00F5FF" stroke-width="0.8" opacity="0.8" />
    <line x1="600" y1="170" x2="800" y2="320" stroke="#00F5FF" stroke-width="0.8" opacity="0.7" />
    <line x1="600" y1="170" x2="1000" y2="320" stroke="#00F5FF" stroke-width="0.8" opacity="0.6" />
    <line x1="600" y1="170" x2="1200" y2="320" stroke="#00F5FF" stroke-width="0.8" opacity="0.5" />
    <line x1="600" y1="170" x2="1400" y2="320" stroke="#00F5FF" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Neural Network Constellation (Left Side) -->
  <g opacity="0.6">
    <line x1="60" y1="80" x2="140" y2="50" stroke="#00F5FF" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="140" y1="50" x2="220" y2="90" stroke="#7928CA" stroke-width="1" />
    <line x1="140" y1="50" x2="170" y2="130" stroke="#00F5FF" stroke-width="1" />
    <line x1="60" y1="80" x2="100" y2="150" stroke="#FF0080" stroke-width="1" />
    <line x1="100" y1="150" x2="170" y2="130" stroke="#00F5FF" stroke-width="1" stroke-dasharray="3,3" />

    <circle cx="60" cy="80" r="4" fill="#00F5FF" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="140" cy="50" r="5" fill="#7928CA" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="220" cy="90" r="3.5" fill="#00F5FF" class="pulse-node" />
    <circle cx="100" cy="150" r="4" fill="#FF0080" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="170" cy="130" r="3.5" fill="#00F5FF" class="pulse-node" />
  </g>

  <!-- Neural Network Constellation (Right Side) -->
  <g opacity="0.6">
    <line x1="1140" y1="80" x2="1060" y2="50" stroke="#00F5FF" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="1060" y1="50" x2="980" y2="90" stroke="#7928CA" stroke-width="1" />
    <line x1="1060" y1="50" x2="1030" y2="130" stroke="#00F5FF" stroke-width="1" />
    <line x1="1140" y1="80" x2="1100" y2="150" stroke="#FF0080" stroke-width="1" />
    <line x1="1100" y1="150" x2="1030" y2="130" stroke="#00F5FF" stroke-width="1" stroke-dasharray="3,3" />

    <circle cx="1140" cy="80" r="4" fill="#00F5FF" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="1060" cy="50" r="5" fill="#7928CA" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="980" cy="90" r="3.5" fill="#00F5FF" class="pulse-node" />
    <circle cx="1100" cy="150" r="4" fill="#FF0080" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="1030" cy="130" r="3.5" fill="#00F5FF" class="pulse-node" />
  </g>

  <!-- Laser Beam Sweeping Across Banner -->
  <g class="laser-beam">
    <rect x="0" y="0" width="160" height="320" fill="url(#laser-grad)" />
    <line x1="80" y1="0" x2="80" y2="320" stroke="#00F5FF" stroke-width="1.5" opacity="0.7" filter="url(#soft-glow)" />
  </g>

  <!-- HUD Frame Borders & Corner Brackets -->
  <g stroke="#00F5FF" stroke-width="1.5" fill="none" opacity="0.8">
    <!-- Top Left Corner -->
    <path d="M 25 45 L 25 25 L 45 25" />
    <circle cx="25" cy="25" r="2" fill="#00F5FF" />

    <!-- Top Right Corner -->
    <path d="M 1175 45 L 1175 25 L 1155 25" />
    <circle cx="1175" cy="25" r="2" fill="#00F5FF" />

    <!-- Bottom Left Corner -->
    <path d="M 25 275 L 25 295 L 45 295" />
    <circle cx="25" cy="295" r="2" fill="#00F5FF" />

    <!-- Bottom Right Corner -->
    <path d="M 1175 275 L 1175 295 L 1155 295" />
    <circle cx="1175" cy="295" r="2" fill="#00F5FF" />

    <!-- Outer Frame Lines -->
    <line x1="55" y1="25" x2="280" y2="25" stroke="#00F5FF" stroke-width="1" stroke-dasharray="6,4" opacity="0.4" />
    <line x1="920" y1="25" x2="1145" y2="25" stroke="#00F5FF" stroke-width="1" stroke-dasharray="6,4" opacity="0.4" />
    <line x1="55" y1="295" x2="1145" y2="295" stroke="#00F5FF" stroke-width="1" stroke-dasharray="10,6" opacity="0.3" />
  </g>

  <!-- Top Telemetry HUD Text -->
  <g class="mono-hud" font-size="11" fill="#00F5FF" opacity="0.75">
    <text x="35" y="42">SYS.ID: PRATYUSH-07 // AI-AGENTIC CORE: v3.4</text>
    <text x="1165" y="42" text-anchor="end">STATUS: 100% OPERATIONAL // LATENCY: &lt;1ms</text>
  </g>

  <!-- Center Card Badge Container -->
  <g transform="translate(600, 150)">
    <!-- Decorative Center Hex HUD Halo -->
    <rect x="-420" y="-105" width="840" height="200" rx="18" fill="url(#badge-grad)" stroke="#00F5FF" stroke-width="1.2" opacity="0.5" filter="url(#soft-glow)" />

    <!-- Center Cyber Brackets -->
    <path d="M -390 -70 L -405 -70 L -405 -45" stroke="#00F5FF" stroke-width="2" fill="none" />
    <path d="M 390 -70 L 405 -70 L 405 -45" stroke="#00F5FF" stroke-width="2" fill="none" />
    <path d="M -390 65 L -405 65 L -405 40" stroke="#00F5FF" stroke-width="2" fill="none" />
    <path d="M 390 65 L 405 65 L 405 40" stroke="#00F5FF" stroke-width="2" fill="none" />

    <!-- Subtitle Pill Tag -->
    <rect x="-175" y="-90" width="350" height="26" rx="13" fill="#060914" stroke="#7928CA" stroke-width="1.2" />
    <text x="0" y="-73" text-anchor="middle" fill="#00F5FF" font-size="11" class="mono-hud" font-weight="700">
      ⟨ INTELLIGENT SYSTEMS &amp; ADVANCED ARCHITECTURE ⟩
    </text>

    <!-- Main Title: PRATYUSH SHARMA -->
    <text x="0" y="-12" text-anchor="middle" fill="url(#title-grad)" font-size="52" class="title-text" filter="url(#neon-glow)">
      PRATYUSH SHARMA
    </text>

    <!-- Technical Mission Sub-Header -->
    <text x="0" y="24" text-anchor="middle" fill="#E2E8F0" font-size="14" class="mono-hud" font-weight="600" opacity="0.95">
      PASSIONATE CS STUDENT  •  FULL-STACK ARCHITECT  •  INTELLIGENT SYSTEMS
    </text>

    <!-- Live Telemetry Badges Underneath -->
    <g transform="translate(0, 58)" class="mono-hud" font-size="11">
      <!-- Badge 1: Neural Core Online -->
      <g transform="translate(-230, 0)">
        <rect x="-10" y="-14" width="145" height="22" rx="11" fill="#080d1e" stroke="#00E676" stroke-width="1" />
        <circle cx="5" cy="-3" r="4" fill="#00E676" class="status-blink" />
        <text x="20" y="1" fill="#00E676" font-weight="600">NEURAL CORE</text>
      </g>

      <!-- Badge 2: Full-Stack Stack -->
      <g transform="translate(-70, 0)">
        <rect x="-10" y="-14" width="155" height="22" rx="11" fill="#080d1e" stroke="#00F5FF" stroke-width="1" />
        <circle cx="5" cy="-3" r="4" fill="#00F5FF" class="status-blink" />
        <text x="20" y="1" fill="#00F5FF" font-weight="600">ENGINE: ACTIVE</text>
      </g>

      <!-- Badge 3: Continuous Innovation -->
      <g transform="translate(100, 0)">
        <rect x="-10" y="-14" width="150" height="22" rx="11" fill="#080d1e" stroke="#FF007F" stroke-width="1" />
        <circle cx="5" cy="-3" r="4" fill="#FF007F" class="status-blink" />
        <text x="20" y="1" fill="#FF007F" font-weight="600">INNOVATION: 100%</text>
      </g>
    </g>
  </g>

  <!-- Digital Oscilloscope / Frequency Sine Wave at Bottom -->
  <g opacity="0.8">
    <path d="M 0 305 Q 150 295 300 305 T 600 305 T 900 305 T 1200 305" fill="none" stroke="#00F5FF" stroke-width="1.8" class="wave-frequency" filter="url(#soft-glow)" />
    <path d="M 0 305 Q 150 315 300 305 T 600 305 T 900 305 T 1200 305" fill="none" stroke="#7928CA" stroke-width="1.2" class="wave-frequency" opacity="0.6" />
  </g>

</svg>
